<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Adi-who's GitHub Stats</title>
  <desc id="descId">Public GitHub stats for Adi-who</desc>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .stat { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .rank { font: 800 36px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .rank-label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="494" fill="#1a1b27" stroke-opacity="1"/>
  <text x="25" y="35" class="header">Adi-who's GitHub Stats</text>
  <g transform="translate(25, 55)">
    <g transform="translate(0, 0)">
      <text class="stat" x="0" y="12.5">Total Stars:</text>
      <text class="stat" x="170" y="12.5" text-anchor="end">0</text>
    </g>
    <g transform="translate(0, 25)">
      <text class="stat" x="0" y="12.5">Total Commits:</text>
      <text class="stat" x="170" y="12.5" text-anchor="end">37</text>
    </g>
    <g transform="translate(0, 50)">
      <text class="stat" x="0" y="12.5">Total PRs:</text>
      <text class="stat" x="170" y="12.5" text-anchor="end">0</text>
    </g>
    <g transform="translate(0, 75)">
      <text class="stat" x="0" y="12.5">Total Issues:</text>
      <text class="stat" x="170" y="12.5" text-anchor="end">0</text>
    </g>
    <g transform="translate(0, 100)">
      <text class="stat" x="0" y="12.5">Public Repos:</text>
      <text class="stat" x="170" y="12.5" text-anchor="end">3</text>
    </g>
  </g>
  <g transform="translate(390, 98)">
    <circle cx="0" cy="0" r="40" stroke="#2f80ed" stroke-opacity="0.25" stroke-width="6" fill="none"/>
    <circle cx="0" cy="0" r="40" stroke="#2f80ed" stroke-width="6" fill="none" stroke-dasharray="16 251" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="6" text-anchor="middle" class="rank">C</text>
    <text x="0" y="58" text-anchor="middle" class="rank-label">Rank</text>
  </g>
