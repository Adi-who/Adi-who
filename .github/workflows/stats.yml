name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: "show_icons=true&theme=tokyonight&count_private=true&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "layout=compact&theme=tokyonight"
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      # One block per pinned project. Duplicate this block and change
      # "repo=" and the output path for each project you want to feature.
      - name: Generate pinned card - repo one
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: "repo=my-portfolio&theme=tokyonight"
          path: path: profile/pin-my-portfolio.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate pinned card - repo two
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: "repo=my-portfolio&theme=tokyonight"
          path: profile/pin-my-portfolio.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate pinned card - repo three
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: "repo=my-portfolio&theme=tokyonight"
          path: profile/pin-my-portfolio.svg
          token: ${{ secrets.GH_PAT }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "Update generated stats SVGs"
          git push
