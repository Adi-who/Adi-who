name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        run: |
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=Adi-who&theme=tokyonight" -o profile/stats.svg

      - name: Generate top languages card
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Adi-who-stats", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as res:
                  return json.loads(res.read().decode())

          repos = get("https://api.github.com/users/Adi-who/repos?per_page=100&type=owner")
          totals = {}
          for repo in repos:
              if repo.get("fork"):
                  continue
              langs = get(repo["languages_url"])
              for name, bytes_count in langs.items():
                  totals[name] = totals.get(name, 0) + bytes_count

          items = sorted(totals.items(), key=lambda item: item[1], reverse=True)[:5]
          total = sum(value for _, value in items) or 1
          colors = {
              "TypeScript": "#3178c6",
              "JavaScript": "#f1e05a",
              "HTML": "#e34c26",
              "CSS": "#663399",
              "Python": "#3572A5",
              "C++": "#f34b7d",
              "C": "#555555",
              "Java": "#b07219",
          }

          bars = []
          labels = []
          x = 0
          for i, (name, value) in enumerate(items):
              width = value / total * 250
              color = colors.get(name, "#70a5fd")
              bars.append(f'<rect mask="url(#rect-mask)" x="{x:.2f}" y="0" width="{width:.2f}" height="8" fill="{color}"/>')
              col = i % 2
              row = i // 2
              tx = 0 if col == 0 else 150
              ty = 25 + row * 25
              pct = value / total * 100
              labels.append(
                  f'<g transform="translate({tx}, {ty})"><circle cx="5" cy="6" r="5" fill="{color}" /><text x="15" y="10" class="lang-name">{name} {pct:.2f}%</text></g>'
              )
              x += width

          svg = f'''<svg width="300" height="140" viewBox="0 0 300 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .header {{ font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }}
    .lang-name {{ font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }}
  </style>
  <rect x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="299" fill="#1a1b27"/>
  <text x="25" y="35" class="header">Most Used Languages</text>
  <g transform="translate(25, 55)">
    <mask id="rect-mask"><rect x="0" y="0" width="250" height="8" fill="white" rx="5"/></mask>
    {''.join(bars)}
    {''.join(labels)}
  </g>
</svg>
'''
          Path("profile/top-langs.svg").write_text(svg)
          PY

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "Update generated stats SVGs"
          git push
